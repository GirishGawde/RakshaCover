<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>RakshaCover settings</title></head>
  <body>
    <main>
      <h1>RakshaCover settings</h1>
      <label>Prevention API URL <input id="api" type="url" placeholder="http://localhost:8001"></label>
      <label><input id="automatic" type="checkbox"> Scan pages automatically</label>
      <label><input id="warnings" type="checkbox"> Show warnings on risky pages</label>
      <button id="save" type="button">Save</button><output id="status"></output>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
